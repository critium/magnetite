[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
magnetite-syntax = { path = "crates/magnetite-syntax" }
magnetite-check = { path = "crates/magnetite-check" }
magnetite-codegen-rust = { path = "crates/magnetite-codegen-rust" }
magnetite-runtime = { path = "crates/magnetite-runtime" }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
